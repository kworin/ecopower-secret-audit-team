name: Security Scan & Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  gitleaks-audit:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Security Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Upload SARIF Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gitleaks.sarif

  container-and-sbom-audit:
    name: Trivy Vulnerability Scan & SBOM Generation
    runs-on: ubuntu-latest
    needs: gitleaks-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Test Microservice Image
        run: |
          docker build -t ecopower-gateway:test .

      - name: Generate CycloneDX SBOM with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          image-ref: "ecopower-gateway:test"
          format: "cyclonedx"
          output: "sbom-cyclonedx.json"

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom-cyclonedx.json

      - name: Quality Gate - Scan Image for Vulnerabilities (CRITICAL & HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ecopower-gateway:test"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
